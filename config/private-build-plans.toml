# Presevka Latin base — stock Iosevka glyph design and width.
# Target Iosevka: v34.8.0.
#
# This file is the Latin half of Presevka, and it is the file to edit if you
# want different letterforms. Presevka supplies its own family metadata and
# nine weights with upright and italic slopes; the 500-unit Latin cell pairs
# with a 1000-unit Hangul cell. Leave the [weights], [slopes] and [widths]
# sections alone unless you also intend to redo the Hangul fitting.
#
# ---------------------------------------------------------------------------
# Customizing the Latin design
# ---------------------------------------------------------------------------
# No character variants are overridden by default: you get stock Iosevka.
#
# To adopt a whole stylistic set, add a variants section. For example,
# ss14 is JetBrains Mono Style and ss18 is Input Mono Style:
#
#     [buildPlans.PresevkaBase500.variants]
#     inherits = "ss14"
#
# To change individual glyphs instead, or on top of an inherited set:
#
#     [buildPlans.PresevkaBase500.variants.design]
#     i = "serifed-asymmetric"
#     zero = "slashed"
#     one = "base"
#
# Every preset and variant name is listed in the Iosevka v34.8.0 custom-build
# documentation:
# https://github.com/be5invis/Iosevka/blob/v34.8.0/doc/custom-build.md
#
# Ready-made variant sets live in config/presets/ and are selected without
# editing this file:
#
#     PRESEVKA_PRESET=adwaita-mono make build
#
# The preset is appended to this plan, so everything below still applies.
# PRESEVKA_PRESET=stock (the default) uses Iosevka's own designs.
#
# After editing, run `make build`. If Pretendard is already prepared in this
# working tree, `./scripts/build_iosevka.sh` then `./scripts/merge.sh` is
# enough. Use `make build-fast` to skip hinting while iterating.

[buildPlans.PresevkaBase500]
family = "Presevka Base 500"
spacing = "normal"
serifs = "sans"
exportGlyphNames = false

# Match Pretendard's nine static weights.
[buildPlans.PresevkaBase500.weights.Thin]
shape = 100
menu = 100
css = 100

[buildPlans.PresevkaBase500.weights.ExtraLight]
shape = 200
menu = 200
css = 200

[buildPlans.PresevkaBase500.weights.Light]
shape = 300
menu = 300
css = 300

[buildPlans.PresevkaBase500.weights.Regular]
shape = 400
menu = 400
css = 400

[buildPlans.PresevkaBase500.weights.Medium]
shape = 500
menu = 500
css = 500

[buildPlans.PresevkaBase500.weights.SemiBold]
shape = 600
menu = 600
css = 600

[buildPlans.PresevkaBase500.weights.Bold]
shape = 700
menu = 700
css = 700

[buildPlans.PresevkaBase500.weights.ExtraBold]
shape = 800
menu = 800
css = 800

[buildPlans.PresevkaBase500.weights.Black]
shape = 900
menu = 900
css = 900

# Iosevka supplies both native Upright and Italic Latin designs. The merge step
# deliberately keeps Pretendard Hangul upright in both faces.
[buildPlans.PresevkaBase500.slopes.Upright]
angle = 0
shape = "upright"
menu = "upright"
css = "normal"

[buildPlans.PresevkaBase500.slopes.Italic]
angle = 9.4
shape = "italic"
menu = "italic"
css = "italic"

# Conventional half-em Latin and full-em Hangul grid.
[buildPlans.PresevkaBase500.widths.Normal]
shape = 500
menu = 5
css = "normal"

# Raised from Iosevka's own 735 so the Latin stands as tall against the Hangul
# as Pretendard's does: 962 of Hangul over a cap of 792 is 1.215, which is the
# 1.211 Pretendard keeps and the 1.215 Sarasa Gothic keeps. At 735 the same
# Hangul reaches 1.309, which is D2Coding's figure rather than Pretendard's.
# Lowercase follows at 0.75 of the cap, the proportion Inter and Pretendard
# both use, where Iosevka draws x at 0.707; most of any code is lowercase.
#
# The cell stays 500, so the Latin grows upward and not outward, and o goes
# from 0.695 of its height to 0.645. Holding that roundness would need the
# side bearings at 0.71 of default rather than 0.95, which opens the counters
# but takes too much of the gap between letters.
#
# 0.6.0 instead took Pretendard's 707/530 wholesale, to put the Latin's optical
# centre on the Hangul's. That turned out to be the expensive way round: the
# centres are a placement, handled where the Hangul is fitted, while the cap
# governs how the Hangul stands against the Latin.
[buildPlans.PresevkaBase500.metricOverride]
cap = 792
ascender = 792
xHeight = 594
# Trim the side bearings a touch, so Iosevka draws into slightly more of the
# cell. 0.7 opened the counters but cost too much of the gap between letters;
# 0.95 is meant to be felt rather than seen.
sb = 'default_sb * 1.05'
