name: build

# A full Iosevka build plus hinting takes well over half an hour, so run it
# once per change: branch pushes are covered by their pull request, and only
# main builds on push.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "config/**"
      - "scripts/**"
      - "tools/**"
      # Not every tool under here feeds the font. These two build the preview
      # page and compose a release body; neither changes a glyph, and a full
      # Iosevka build plus hinting is over half an hour to prove that.
      - "!tools/build_preview_fonts.py"
      - "!tools/release_notes.py"
      - "LICENSE"
      - "LICENSE-CODE"
      - "OFL.txt"
      - "THIRD_PARTY.md"
      - "FONTLOG.md"
      - "pyproject.toml"
      - ".github/workflows/build.yml"
  pull_request:
    paths:
      - "config/**"
      - "scripts/**"
      - "tools/**"
      # Not every tool under here feeds the font. These two build the preview
      # page and compose a release body; neither changes a glyph, and a full
      # Iosevka build plus hinting is over half an hour to prove that.
      - "!tools/build_preview_fonts.py"
      - "!tools/release_notes.py"
      - "LICENSE"
      - "LICENSE-CODE"
      - "OFL.txt"
      - "THIRD_PARTY.md"
      - "FONTLOG.md"
      - "pyproject.toml"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true

      # Iosevka is a shallow clone plus a full npm install; both dominate the
      # build. Keyed on the pinned refs so a version bump invalidates the cache.
      - name: Restore upstream sources
        uses: actions/cache@v6
        with:
          path: |
            .cache/src/Iosevka
            .cache/src/pretendard
          key: upstream-${{ hashFiles('scripts/build_iosevka.sh', 'scripts/build_pretendard.sh') }}
          restore-keys: upstream-

      - name: Build Presevka
        run: ./scripts/build.sh

      - name: Upload font artifact
        uses: actions/upload-artifact@v7
        with:
          name: presevka-ttf
          path: |
            dist/Presevka-*.ttf
            dist/OFL.txt
            dist/licenses/
            dist/THIRD_PARTY.md
            dist/FONTLOG.md
