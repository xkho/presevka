name: pages

# The preview page needs web fonts, and they are large: nine weights come to
# 12.6 MB once cut down, which is not something to carry in the repository for
# a page that can rebuild them in two minutes. So the faces are taken from the
# latest release and subset here, and only the page itself is version
# controlled. Publishing a release refreshes the preview on its own.

on:
  # A release event runs on its tag, not on main, and the github-pages
  # environment only accepts deployments from the refs listed in its branch
  # policy. Without `v*` in that list the build succeeds and the deploy is
  # rejected with "Tag vX.Y.Z is not allowed to deploy to github-pages", which
  # is what happened to v0.8.1. The page itself is not versioned -- it always
  # shows the latest release's fonts -- so what the tag contributes is only
  # the timing.
  release:
    types: [published]
  push:
    branches: [main]
    paths:
      - site/**
      - tools/build_preview_fonts.py
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A release and a push to main can land together; let the later one win rather
# than deploying twice.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Fetch the latest release's web fonts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/webfonts
          gh release download --repo "$GITHUB_REPOSITORY" \
            --pattern '*-woff2.zip' --dir build
          unzip -q -j "build/"*-woff2.zip -d build/webfonts -x '*/licenses/*'
          ls build/webfonts/*.woff2 | wc -l

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Cut the faces down for the page
        run: |
          uv run --with 'fonttools[woff]>=4.63.0' --with brotli --with 'uharfbuzz>=0.56.0' \
            python tools/build_preview_fonts.py \
            --font-dir build/webfonts --output-dir site/fonts \
            --slopes Upright,Italic
          du -sh site/fonts

      # Turns Pages on the first time this runs, so the site does not need
      # setting up by hand before the workflow can deploy to it.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
